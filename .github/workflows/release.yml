name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Build release assets
        run: |
          sh build-release.sh "$GITHUB_REF_NAME"
          sed "s/^RELEASE_TAG=latest$/RELEASE_TAG=$GITHUB_REF_NAME/" install.sh > dist/install.sh
          sh -n dist/install.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set --
          case "$GITHUB_REF_NAME" in *-*) set -- --prerelease --latest=false ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "$@" \
            dist/install.sh dist/SHA256SUMS dist/xkeen-subscription-watcher-linux-*
